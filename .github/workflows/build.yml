# The Factory: builds one project's app for Mac, Windows and Linux, tests each,
# and offers the results as downloads.
#
# Three ways it starts:
#   - By itself, when the Runner or the example projects change. Builds the
#     image resizer example.
#   - By hand from the repository's Actions tab ("Run workflow").
#   - From the website, through GitHub's API, with an uploaded project:
#       POST /repos/<owner>/<repo>/actions/workflows/build.yml/dispatches
#       { "ref": "main", "inputs": { "build_id": "...", "project_url": "...",
#                                    "app_url": "...", "sample_url": "..." } }
#     The run is then titled "Build <build_id>", which is how to find it again.
#
# Where the finished apps go:
#   - Every run: under "Artifacts" on the run's page (needs a GitHub login).
#   - Runs started by hand or by the website: also on a public release named
#     build-<build_id>, which anyone can download from without logging in:
#       https://github.com/<owner>/<repo>/releases/download/build-<build_id>/app-mac.zip
#       https://github.com/<owner>/<repo>/releases/download/build-<build_id>/app-windows.zip
#       https://github.com/<owner>/<repo>/releases/download/build-<build_id>/app-linux.zip
#     A system whose build or test failed has no file there.
#   - A picture of the app's window: the "screenshot" artifact on the run, and
#     screenshot.png on the release.

name: Build apps
run-name: Build ${{ inputs.build_id || 'example project' }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: A name for this build, chosen by whoever starts it
        default: manual
      project_url:
        description: Web address of the uploaded project zip (leave empty to build a folder in this repository)
        default: ''
      app_url:
        description: Web address of the Analyzer's result for that zip (manifest, name, description)
        default: ''
      sample_url:
        description: Web address of sample inputs for the test run (optional)
        default: ''
      project:
        description: Folder in this repository to build, when no project_url is given
        default: examples/image_resizer
  push:
    paths:
      - runner/**
      - examples/**
      - analyzer/src/manifest/**
      - .github/workflows/build.yml

# This job installs and runs code that strangers uploaded. Give it no ability
# to change the repository, and never add passwords or keys to it.
permissions:
  contents: read

jobs:
  build:
    name: Build for ${{ matrix.system }}
    strategy:
      # If one system fails, still finish the others, so we see every result.
      fail-fast: false
      matrix:
        include:
          - system: Mac
            os: macos-latest
          - system: Windows
            os: windows-latest
          - system: Linux
            os: ubuntu-latest
            # Linux build machines have no screen; this gives the app a pretend one.
            screen: xvfb-run -a
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: runner
        # Use the same shell on every system so the commands below are identical.
        shell: bash

    env:
      PROJECT: ${{ inputs.project || 'examples/image_resizer' }}
      PROJECT_URL: ${{ inputs.project_url }}
      APP_URL: ${{ inputs.app_url }}
      SAMPLE_URL: ${{ inputs.sample_url }}

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: runner/package-lock.json

      - name: Install the Runner's tools
        run: npm ci

      - name: Check the Runner's own logic
        run: npm test

      - name: Gather a private Python and the project
        run: |
          if [ -n "$PROJECT_URL" ]; then
            node scripts/fetch-project.mjs "$PROJECT_URL" "$APP_URL" "$SAMPLE_URL"
            npm run stage -- resources/upload
          else
            npm run stage -- "../$PROJECT"
          fi

      - name: Build the app
        run: npm run package

      # Recent Ubuntu blocks a safety feature Electron relies on unless the app
      # is installed system-wide. Allow it on this build machine.
      - name: Let the app start on the Linux build machine
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Test the built app
        run: ${{ matrix.screen }} npm run smoke

      # Only reached if the test above passed.
      - name: Offer the app as a download
        uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.system }}
          path: runner/dist/*.zip
          if-no-files-found: error

      # One picture of the app's window, for the website to show. The Mac one
      # is used because its text looks best. Named so that it can't be mistaken
      # for one of the app downloads.
      - name: Offer a picture of the app's window
        if: matrix.system == 'Mac'
        uses: actions/upload-artifact@v7
        with:
          name: screenshot
          path: runner/dist/screenshot.png
          if-no-files-found: warn

  # Puts the finished apps somewhere anyone can download them. This job never
  # runs uploaded code: it only moves the files the build job produced. That is
  # why it, and not the build job, is allowed to write to the repository.
  publish:
    name: Publish downloads
    needs: build
    # Only for builds someone asked for, and even if one system failed, so the
    # systems that did pass are still published.
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BUILD_ID: ${{ inputs.build_id }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Check the build id is safe to use in a web address
        run: |
          if ! [[ "$BUILD_ID" =~ ^[A-Za-z0-9._-]{1,64}$ ]]; then
            echo "build_id may only contain letters, numbers, dots, dashes and underscores."
            exit 1
          fi

      - name: Collect the apps that passed
        uses: actions/download-artifact@v8
        with:
          pattern: app-*
          path: apps

      - name: Collect the picture of the app's window, if there is one
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: screenshot
          path: picture

      - name: Give each app a fixed file name
        run: |
          mkdir out
          for system in Mac Windows Linux; do
            zip=$(find "apps/app-$system" -name '*.zip' 2>/dev/null | head -n 1)
            if [ -n "$zip" ]; then
              cp "$zip" "out/app-$(echo "$system" | tr '[:upper:]' '[:lower:]').zip"
            fi
          done
          ls -l out
          if [ -z "$(ls out)" ]; then
            echo "No system produced an app, so there is nothing to publish."
            exit 1
          fi
          if [ -f picture/screenshot.png ]; then cp picture/screenshot.png out/; fi

      - name: Publish to a release
        run: |
          tag="build-$BUILD_ID"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "Build $BUILD_ID" \
              --notes "Apps built by the SimplyOpen Factory. Each was started and tested before being published."
          fi
          gh release upload "$tag" out/* --clobber
          echo "Published: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag"
